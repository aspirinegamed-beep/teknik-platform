<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080b12">
<title>AI Nova Tool</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="assets/nova-v4.css">

<style>
.v52{
max-width:1050px;
margin:auto;
padding:22px 16px 80px;
}

.v52-card{
background:rgba(255,255,255,.045);
border:1px solid rgba(255,255,255,.09);
border-radius:22px;
padding:20px;
margin:14px 0;
}

.v52-head{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:12px;
flex-wrap:wrap;
}

.v52-status{
padding:7px 11px;
border-radius:999px;
background:rgba(255,255,255,.07);
font-size:12px;
}

.v52-grid{
display:grid;
grid-template-columns:repeat(2,minmax(0,1fr));
gap:12px;
}

.v52-field{
display:flex;
flex-direction:column;
gap:7px;
}

.v52-field label{
font-size:13px;
opacity:.75;
}

.v52-field input{
background:#090d15;
color:#fff;
border:1px solid rgba(255,255,255,.12);
border-radius:12px;
padding:12px;
outline:none;
}

.v52-textarea{
width:100%;
box-sizing:border-box;
min-height:240px;
background:#090d15;
color:#fff;
border:1px solid rgba(255,255,255,.12);
border-radius:16px;
padding:15px;
font:inherit;
resize:vertical;
}

.v52-output{
white-space:pre-wrap;
min-height:220px;
overflow:auto;
}

.v52-actions{
display:flex;
gap:9px;
flex-wrap:wrap;
margin-top:12px;
}

.v52-btn{
border:0;
border-radius:12px;
padding:12px 16px;
font-weight:700;
cursor:pointer;
}

.v52-btn.alt{
background:rgba(255,255,255,.08);
color:#fff;
}

@media(max-width:650px){
.v52-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="v52">

<a href="index.html">← AI Nova</a>

<section class="v52-card">
<div class="v52-head">
<div>
<h1 id="title">AI Nova Tool</h1>
<p id="family"></p>
</div>
<div id="status" class="v52-status"></div>
</div>
</section>

<section class="v52-card">

<div class="v52-grid">

<div class="v52-field">
<label>Value / Amount</label>
<input id="value" placeholder="Optional">
</div>

<div class="v52-field">
<label>Percent</label>
<input id="percent" type="number" placeholder="Optional">
</div>

<div class="v52-field">
<label>Pattern</label>
<input id="pattern" placeholder="For Regex tools">
</div>

<div class="v52-field">
<label>Length</label>
<input id="length" type="number" value="18">
</div>

<div class="v52-field">
<label>Total</label>
<input id="total" type="number" placeholder="Optional">
</div>

<div class="v52-field">
<label>URL</label>
<input id="url" placeholder="https://example.com">
</div>

</div>

<br>

<label>Input</label>
<textarea id="input" class="v52-textarea"
placeholder="Enter your data here..."></textarea>

<div class="v52-actions">
<button id="run" class="v52-btn">Run Tool</button>
<button id="copy" class="v52-btn alt">Copy</button>
<button id="download" class="v52-btn alt">Download</button>
<button id="clear" class="v52-btn alt">Clear</button>
</div>

</section>

<section class="v52-card">
<h3>Output</h3>
<pre id="output" class="v52-output"></pre>
</section>

</div>

<script src="assets/nova-engine-v52.js"></script>

<script>
(async()=>{

const id=new URLSearchParams(location.search).get("id");

const registry=await fetch("data/tool-registry.json")
.then(r=>r.json());

const tool=registry.tools.find(x=>x.id===id);

if(!tool){
document.getElementById("title").textContent="Tool not found";
return;
}

document.title=tool.name+" — AI Nova";

document.getElementById("title").textContent=tool.name;

document.getElementById("family").textContent=
"Category: "+(tool.category||"Utility")+" • Family: "+tool.family;

document.getElementById("status").textContent=
tool.status==="available"
?"AVAILABLE • LOCAL • OFFLINE"
:"COMING SOON";

const input=document.getElementById("input");
const output=document.getElementById("output");

function options(){

return {
value:document.getElementById("value").value,
amount:document.getElementById("value").value,
percent:document.getElementById("percent").value,
pattern:document.getElementById("pattern").value,
length:document.getElementById("length").value,
total:document.getElementById("total").value,
url:document.getElementById("url").value
};

}

document.getElementById("run").onclick=async()=>{

if(tool.status!=="available"){
output.textContent=
"This tool is currently Coming Soon.\n\n"+
"AI Nova does not generate fake results.";
return;
}

let result=AINovaV52.run(tool,input.value,options());

if(result instanceof Promise)
result=await result;

output.textContent=result;

localStorage.setItem(
"aiNova:lastTool",
tool.id
);

let recent=[];

try{
recent=JSON.parse(
localStorage.getItem("aiNova:recent")||"[]"
);
}catch(e){}

recent=[
tool.id,
...recent.filter(x=>x!==tool.id)
].slice(0,12);

localStorage.setItem(
"aiNova:recent",
JSON.stringify(recent)
);

};

document.getElementById("copy").onclick=async()=>{

if(!output.textContent)return;

try{
await navigator.clipboard.writeText(
output.textContent
);
}catch(e){}

};

document.getElementById("download").onclick=()=>{

AINovaV52.download(
tool.id+".txt",
output.textContent||"",
"text/plain"
);

};

document.getElementById("clear").onclick=()=>{

input.value="";
output.textContent="";

};

})();
</script>

</body>
</html>
