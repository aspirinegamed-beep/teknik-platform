<!doctype html>
<html lang="en">
<head>

<meta charset="utf-8">

<meta
    name="viewport"
    content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta name="theme-color" content="#080b12">

<title>AI Nova Tool</title>

<link rel="manifest" href="manifest.json">

<link rel="stylesheet" href="assets/nova-v4.css">

<style>

.smart-page {
    max-width: 1050px;
    margin: auto;
    padding: 20px 15px 80px;
}

.smart-card {
    background: rgba(255,255,255,.045);
    border: 1px solid rgba(255,255,255,.09);
    border-radius: 24px;
    padding: 20px;
    margin: 14px 0;
}

.smart-head {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    flex-wrap: wrap;
}

.smart-status {
    padding: 7px 12px;
    border-radius: 999px;
    background: rgba(255,255,255,.07);
    font-size: 12px;
}

.smart-grid {
    display: grid;
    grid-template-columns: repeat(2,minmax(0,1fr));
    gap: 13px;
}

.smart-field {
    display: flex;
    flex-direction: column;
    gap: 7px;
}

.smart-field label {
    font-size: 13px;
    opacity: .78;
}

.smart-field input,
.smart-field textarea {
    width: 100%;
    box-sizing: border-box;
    background: #090d15;
    color: #fff;
    border: 1px solid rgba(255,255,255,.12);
    border-radius: 13px;
    padding: 12px;
    font: inherit;
    outline: none;
}

.smart-field textarea {
    min-height: 170px;
    resize: vertical;
}

.smart-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 9px;
    margin-top: 15px;
}

.smart-btn {
    border: 0;
    border-radius: 12px;
    padding: 12px 17px;
    font-weight: 700;
    cursor: pointer;
}

.smart-btn.alt {
    background: rgba(255,255,255,.08);
    color: #fff;
}

.smart-output {
    min-height: 220px;
    white-space: pre-wrap;
    overflow: auto;
    background: #090d15;
    border-radius: 16px;
    padding: 16px;
}

@media(max-width:680px) {
    .smart-grid {
        grid-template-columns: 1fr;
    }
}

</style>

</head>

<body>

<div class="smart-page">

<a href="index.html">← AI Nova</a>

<section class="smart-card">

<div class="smart-head">

<div>
<h1 id="title">AI Nova Tool</h1>
<p id="family"></p>
</div>

<div
    id="status"
    class="smart-status"
>
Loading...
</div>

</div>

</section>

<section class="smart-card">

<div
    id="fields"
    class="smart-grid"
></div>

<div class="smart-actions">

<button
    id="run"
    class="smart-btn"
>
Run Tool
</button>

<button
    id="copy"
    class="smart-btn alt"
>
Copy
</button>

<button
    id="download"
    class="smart-btn alt"
>
Download
</button>

<button
    id="clear"
    class="smart-btn alt"
>
Clear
</button>

</div>

</section>

<section class="smart-card">

<h3>Output</h3>

<pre
    id="output"
    class="smart-output"
></pre>

</section>

</div>

<script src="assets/nova-engine-v52.js"></script>
<script src="assets/nova-smart-ui.js"></script>

<script>

(async () => {

    const params = new URLSearchParams(location.search);
    const id = params.get("id");

    const registry = await fetch("data/tool-registry.json")
        .then(r => r.json());

    const tool = registry.tools.find(x => x.id === id);

    if (!tool) {

        document.getElementById("title").textContent =
            "Tool Not Found";

        document.getElementById("status").textContent =
            "Invalid tool";

        return;
    }

    document.getElementById("title").textContent =
        tool.name || tool.title || tool.id;

    document.getElementById("family").textContent =
        tool.family || "general";

    const profile =
        await window.AINovaSmartUI.load(id);

    window.AINovaSmartUI.render(
        profile,
        document.getElementById("fields")
    );

    document.getElementById("status").textContent =
        tool.status || "Available";

    const output =
        document.getElementById("output");

    document.getElementById("run").onclick =
        async () => {

            output.textContent = "Processing...";

            try {

                const values =
                    window.AINovaSmartUI.values(profile);

                let result = null;

                if (
                    window.AINova &&
                    typeof window.AINova.run === "function"
                ) {

                    result = await window.AINova.run(
                        tool,
                        values
                    );

                } else if (
                    window.AINovaV52 &&
                    typeof window.AINovaV52.run === "function"
                ) {

                    result = await window.AINovaV52.run(
                        tool,
                        values
                    );

                } else {

                    result =
                        "This tool is not connected to a local implementation yet.";
                }

                if (
                    result &&
                    typeof result === "object"
                ) {

                    output.textContent =
                        JSON.stringify(result,null,2);

                } else {

                    output.textContent =
                        String(result ?? "");
                }

            } catch (error) {

                output.textContent =
                    "Error: " + error.message;
            }

        };

    document.getElementById("copy").onclick =
        async () => {

            const text = output.textContent;

            if (!text) return;

            await navigator.clipboard.writeText(text);

            const btn =
                document.getElementById("copy");

            const old = btn.textContent;

            btn.textContent = "Copied";

            setTimeout(
                () => btn.textContent = old,
                1200
            );
        };

    document.getElementById("download").onclick =
        () => {

            const text = output.textContent;

            if (!text) return;

            const blob =
                new Blob(
                    [text],
                    {type:"text/plain;charset=utf-8"}
                );

            const url =
                URL.createObjectURL(blob);

            const a =
                document.createElement("a");

            a.href = url;
            a.download =
                (tool.id || "ai-nova-result") +
                "-result.txt";

            a.click();

            URL.revokeObjectURL(url);
        };

    document.getElementById("clear").onclick =
        () => {

            document.getElementById("fields")
                .querySelectorAll("input,textarea")
                .forEach(el => el.value = "");

            output.textContent = "";
        };

})();

</script>

</body>
</html>
